# Prompt. This IS ~/.config/starship.toml (home-manager links it here), so
# edit either path. starship re-reads it on every prompt - changes are
# instant, no command needed.

add_newline = false
command_timeout = 1000
format = "$directory$git_branch$git_status$nix_shell$python$rust$nodejs$cmd_duration$line_break$character"

[directory]
truncation_length = 3
truncate_to_repo = false

[git_status]
disabled = false

[nix_shell]
format = "[$symbol$name]($style) "
symbol = "❄ "

[cmd_duration]
min_time = 2000

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
